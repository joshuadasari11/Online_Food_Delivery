services:
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - RESTAURANT_SERVICE_URL=http://restaurant-service:5001
      - DELIVERY_SERVICE_URL=http://delivery-service:5002
    depends_on:
      - restaurant-service
      - delivery-service
    networks:
      - fooddelivery-network
    restart: unless-stopped

  restaurant-service:
    build:
      context: ./restaurant-service
      dockerfile: Dockerfile
    container_name: restaurant-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
    networks:
      - fooddelivery-network
    restart: unless-stopped

  delivery-service:
    build:
      context: ./delivery-service
      dockerfile: Dockerfile
    container_name: delivery-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
    networks:
      - fooddelivery-network
    restart: unless-stopped

networks:
  fooddelivery-network:
    driver: bridge
    name: fooddelivery-network
